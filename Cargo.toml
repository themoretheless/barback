[package]
name = "barback"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.91"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
chrono-tz = "0.10.4"
percent-encoding = "2.3.2"
quick-xml = "0.41.0"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "native-tls", "gzip", "charset", "http2", "system-proxy", "form", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
url = "2.5.8"

[dev-dependencies]
wiremock = "0.6.5"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.24"
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = [
    "NSString",
    "NSGeometry",
    "NSObjCRuntime",
    "NSThread",
] }
objc2-app-kit = { version = "0.2", features = [
    "NSApplication",
    "NSStatusBar",
    "NSStatusItem",
    "NSStatusBarButton",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSRunningApplication",
    "NSImage",
    "NSButton",
    "NSControl",
    "NSView",
] }
