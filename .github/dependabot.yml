# Pins rot quietly. Nothing in CI notices that actions/checkout is two majors
# behind or that a crate shipped a security fix, because a green build is exactly
# what a stale pin produces.
#
# Not covered here: rust-toolchain.toml. Dependabot has no Rust toolchain
# ecosystem, so the compiler pin stays a manual bump, in its own commit, after
# fixing whatever the new clippy has started complaining about.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    # One pull request for all of them. There are two actions in the tree and
    # they move together; a pull request each would be pure noise.
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    # Patch only, which is narrower than it looks: every dependency here is a 0.x
    # release, and cargo treats the minor of a 0.x as breaking, so ^0.5 resolves
    # to >=0.5.0, <0.6.0. Dependabot names update types by position, which makes
    # 0.5 to 0.6 a "minor" to it and a rewrite to us. Grouping minors would
    # therefore batch precisely the changes that have to be read: objc2 0.5 to
    # 0.6 renames declare_class! to define_class! and reworks every ivar
    # declaration in app.rs.
    #
    # There is no group for majors because not one dependency has reached 1.0.
    # Revisit both halves of this when one does.
    groups:
      patches:
        patterns: ["*"]
        update-types: ["patch"]
